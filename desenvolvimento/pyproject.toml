[project]
name = "eventus"
version = "0.1.0"
description = "Regras de negócio do Eventus (sistema fictício de gestão de eventos)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "httpx>=0.28.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
